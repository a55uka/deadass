[package]
name = "deadasss-companion"
version = "0.1.0"
edition = "2024"

[dependencies]
deadass-shared = { path = "../shared" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
axum = "0.7"
anyhow = "1"
thiserror = "2"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
buttplug_client = "11"
buttplug_core = "11"
buttplug_transport_websocket_tungstenite = "11"
steamlocate = "2.1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
buttplug_client_in_process = "11"
buttplug_server = "11"
buttplug_server_device_config = "11"
buttplug_server_hwmgr_btleplug = "11"
buttplug_server_hwmgr_lovense_connect = "11"
buttplug_server_hwmgr_lovense_dongle = "11"
buttplug_server_hwmgr_websocket = "11"

[target.'cfg(windows)'.dependencies]
buttplug_server_hwmgr_xinput = "11"
