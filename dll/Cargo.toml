[package]
name = "deadass-dll"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Networking_WinSock"] }

[dependencies]
deadass-shared = { path = "../shared" }
serde_json = "1"
